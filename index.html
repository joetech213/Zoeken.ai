<script>
/* -------------------- Config -------------------- */
const OPENAI_KEY = "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";
const PEXELS_API_KEY = "Raq63E0SFpeDD0zTCr1GeKpXBGCYkhnP1KH1HPtPWNrxZPvFWfmQVRtM";
const YOUTUBE_API_KEY = "AIzaSyA0v0xRWpcev7FEu-YcvhkqG1GKrrqLMc4";

/* -------------------- Helpers -------------------- */
const $ = (sel, ctx=document) => ctx.querySelector(sel);
const $$ = (sel, ctx=document) => Array.from((ctx||document).querySelectorAll(sel));
const escapeHtml = s => s ? String(s).replace(/[&<>\"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c])) : '';

/* -------------------- Elements -------------------- */
const qInput = $('#q');
const form = $('#searchForm');
const tabs = $$('.tab');
const panels = {
  all: $('#panel-all'),
  images: $('#panel-images'),
  videos: $('#panel-videos'),
  news: $('#panel-news'),
  books: $('#panel-books')
};
const resultsEl = $('#results');
const metaAll = $('#metaAll');
const imagesGrid = $('#imagesGrid');
const metaImages = $('#metaImages');
const imagePreviewModal = $('#imagePreviewModal');
const imagePreviewImg = $('#imagePreviewImg');
const closePreview = $('#closePreview');
const videosGrid = $('#videosGrid');
const metaVideos = $('#metaVideos');
const newsList = $('#newsList');
const metaNews = $('#metaNews');
const booksList = $('#booksList');
const metaBooks = $('#metaBooks');
const homeNewsBox = document.getElementById("homeNews");
const homeNewsList = document.getElementById("homeNewsList");
const aiAnswerEl = $('#aiAnswer');
const wikiSummaryEl = $('#wikiSummary');
const urlInput = $('#urlInput');
const openUrlBtn = $('#openUrlBtn');
const prevBtn = $('#prevBtn');
const nextBtn = $('#nextBtn');
const pageIndicator = $('#pageIndicator');
const micBtn = $('#micBtn');
const aiSpeechBtn = $('#aiSpeechBtn');

/* -------------------- State -------------------- */
let currentPage = { images:1, videos:1, news:1, books:1 };
let currentQuery = '';
let youtubePageTokens = {}; // { query: { prev:'', next:'' } }

/* -------------------- Tabs -------------------- */
tabs.forEach(t => {
  t.addEventListener('click', ()=>setTab(t.dataset.tab));
  t.addEventListener('keydown', (e)=> { if(e.key === 'Enter') setTab(t.dataset.tab); });
});
function setTab(name){
  tabs.forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  Object.entries(panels).forEach(([k,el])=> el.style.display = (k===name) ? 'block' : 'none');
  updatePageIndicator();
}

/* -------------------- Keyboard shortcut for search -------------------- */
window.addEventListener('keydown', e=>{
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ 
    e.preventDefault(); 
    qInput.focus(); 
  }
});

/* -------------------- URL bar -------------------- */
openUrlBtn.addEventListener('click', ()=>{
  const url = urlInput.value.trim();
  if(url) window.location.href = url;
});

/* -------------------- Search submit -------------------- */
form.addEventListener('submit', e=>{
  e.preventDefault();
  const q = qInput.value.trim();
  if(!q) return;
  runAll(q);
});

/* -------------------- Run all searches -------------------- */
async function runAll(query){

  // FIX 3: hide homepage news when searching
  homeNewsBox.style.display = "none";

  currentQuery = query;
  currentPage = { images:1, videos:1, news:1, books:1 };
  youtubePageTokens[query] = { next:'', prev:'' };

  setTab('all');

  resultsEl.innerHTML = ''; 
  imagesGrid.innerHTML = ''; 
  videosGrid.innerHTML = ''; 
  newsList.innerHTML = ''; 
  booksList.innerHTML = '';
  
  metaAll.textContent = `Searching "${query}"...`; 
  metaImages.textContent = `Searching images for "${query}"...`; 
  metaVideos.textContent = `Searching videos for "${query}"...`; 
  metaNews.textContent =
   `Searching news for "${query}"...`; 
  metaBooks.textContent = `Searching books for "${query}"...`;
  
  aiAnswerEl.innerHTML = ''; 
  wikiSummaryEl.innerHTML = '';

  fetchChatGPTAnswer(query).catch(console.warn);
  runWiki(query).catch(console.warn);
  runWeb(query).catch(console.warn);
  fetchPexelsImages(query, currentPage.images).catch(console.warn);
  fetchVideos(query, currentPage.videos).catch(console.warn);
  fetchNews(query, currentPage.news).catch(console.warn);
  fetchBooks(query, currentPage.books).catch(console.warn);
}


/* -------------------- ChatGPT Answer -------------------- */
async function fetchChatGPTAnswer(query) {
  aiAnswerEl.innerHTML = `<div class="ai-card"><div class="ai-title">🧠 Zoeken AI — generating summary…</div><div class="small"></div></div>`;
  if(!OPENAI_KEY || OPENAI_KEY.includes('REPLACE')) return;
  try {
    const payload = {
      model: "gpt-4o-mini",
      messages: [
        {
  role: "system",
  content: "Your name is Zoeken AI. Provide a concise (3-6 sentences), highly logical and analytical summary. Focus on identifying patterns, interp relationships, and cause-effect connections. Prioritize clarity, accuracy, and structured reasoning. Avoid irrelevant or inappropriate content."
},

        { role: "user", content: `Summarize: "${query}" concisely.` }
      ],
      max_tokens: 220,
      temperature: 0.2
    };
    const res = await fetch("https://api.openai.com/v1/chat/completions", {
      method:"POST",
      headers: {"Content-Type":"application/json","Authorization":`Bearer ${OPENAI_KEY}`},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    const answer = data.choices?.[0]?.message?.content || "No response.";
    aiAnswerEl.innerHTML = `<div class="ai-card"><div class="ai-title">🧠 Zoeken AI</div><div class="r-snippet">${escapeHtml(answer)}</div></div>`;
  } catch(err){
    console.error(err);
    aiAnswerEl.innerHTML = `<div class="ai-card"><div class="ai-title">AI error</div><div class="small">${escapeHtml(err.message)}</div></div>`;
  }
}

/* -------------------- Wikipedia -------------------- */
async function runWiki(query){
  wikiSummaryEl.innerHTML = `<div class="small">Loading Wikipedia summary…</div>`;
  try {
    const summaryRes = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`);
    if(summaryRes.ok){
      const s = await summaryRes.json();
      let html = `<div class="result"><div class="r-title">${escapeHtml(s.title||query)}</div>`;
      if(s.extract) html += `<div class="r-snippet">${escapeHtml(s.extract)}</div>`;
      if(s.content_urls?.desktop?.page){
        html += `<div style="margin-top:8px"><a class="btn" href="${escapeHtml(s.content_urls.desktop.page)}" target="_blank">Read on Wikipedia</a></div>`;
      }
      html += `</div>`;
      wikiSummaryEl.innerHTML = html;
    } else wikiSummaryEl.innerHTML = `<div class="small">No exact Wikipedia summary found.</div>`;
  } catch(err){
    wikiSummaryEl.innerHTML = `<div class="small">Wikipedia fetch failed.</div>`;
    console.warn(err);
  }
}

/* -------------------- Web Search -------------------- */
async function runWeb(query) {
  const resultsContainer = document.getElementById("results");
  resultsContainer.innerHTML = `
    <div class="result loading">
      <div class="title">Searching the web for “${escapeHtml(query)}”...</div>
      <div class="snippet muted">Please wait...</div>
    </div>
  `;

  if (!OPENAI_KEY || OPENAI_KEY.includes("REPLACE")) {
    console.warn("OPENAI_KEY missing or placeholder — falling back to DuckDuckGo.");
    return renderDuckDuckGoFallback(query, resultsContainer);
  }

  try {
    // --- Step 1: Check if query looks like a website ---
    let possibleUrl = query.toLowerCase().replace(/\s+/g,'');
    let isWebsiteQuery = /^[\w-]+\.(com|org|net|io|co)$/i.test(possibleUrl); // simple TLD check
    if (isWebsiteQuery && !/^https?:\/\//i.test(possibleUrl)) possibleUrl = "https://www." + possibleUrl;

    let officialSiteExists = false;
    if (isWebsiteQuery) {
      try {
        await fetch(possibleUrl, { method: "HEAD", mode: "no-cors" });
        officialSiteExists = true;
      } catch(e) {
        officialSiteExists = true; // assume exists if blocked
      }
    }

    // --- Step 2: Use ChatGPT multi-brain search ---
    const payload = {
      model: "gpt-4.1-mini",
      tools: [{ type: "web_search" }],
      input: `You are a smart website search assistant.
Search the web for: "${query}".
Return top 8 results as a JSON array ONLY (no extra commentary) in this format:
[
  { "title": "Page title", "url": "https://...", "snippet": "1-2 sentence summary" }
]
Rules:
- If the query is a website or official brand (like YouTube, Wikipedia), prioritize official URL first.
- If it's a YouTube channel or video, include the direct link.
- If not a website, include related/popular pages, summaries, or Wikipedia link if relevant.
- Return empty array if nothing found.`,
      temperature: 0.1,
      max_output_tokens: 800
    };

    const res = await fetch("https://api.openai.com/v1/responses", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${OPENAI_KEY}`
      },
      body: JSON.stringify(payload)
    });

    const data = await res.json();
    let text = "";
    if (Array.isArray(data.output) && data.output.length) {
      text = data.output.map(o => (o.content || []).map(c => c.text || "").join("")).join("\n\n");
    } else if (data.output_text) {
      text = data.output_text;
    } else {
      text = JSON.stringify(data);
    }

    // --- Step 3: Extract JSON results ---
    let results = [];
    const arrayMatch = text.match(/\[[\s\S]*\]/);
    if (arrayMatch) {
      try { results = JSON.parse(arrayMatch[0]); }
      catch(e){ 
        const sanitize = s => s.replace(/,\s*]/g, "]").replace(/,\s*}/g, "}").replace(/([\w]+):/g, (m,p)=> `"${p}":`).replace(/'/g, '"');
        try { results = JSON.parse(sanitize(arrayMatch[0])); } catch(e2){ results = []; }
      }
    }

    // --- Step 4: Add official site only if query is a website ---
    if (isWebsiteQuery && officialSiteExists && !results.some(r => r.url?.includes(possibleUrl))) {
      results.unshift({
        title: query + " Official Website",
        url: possibleUrl,
        snippet: "Official site of " + query
      });
    }

    // --- Step 5: Fallback to DuckDuckGo if no results ---
    if (!results.length) return renderDuckDuckGoFallback(query, resultsContainer);

    // --- Step 6: Render results ---
// --- Step 6: Render results ---
resultsContainer.innerHTML = results.map(r => `
  <div class="result">
    <a href="${escapeHtml(r.url)}" class="r-title">${escapeHtml(r.title)}</a>
    <div class="r-link">${escapeHtml(r.url)}</div>
    <div class="r-snippet">${escapeHtml(r.snippet || '')}</div>
  </div>
`).join("");


  } catch (err) {
    console.error("runWeb error:", err);
    await renderDuckDuckGoFallback(query, resultsContainer);
  }
}



/* -------------------- Images -------------------- */
async function fetchPexelsImages(query, page = 1) {
  metaImages.textContent = `Images for "${query}" — page ${page}`;
  const res = await fetch(`https://api.pexels.com/v1/search?query=${encodeURIComponent(query)}&per_page=12&page=${page}`, {
    headers: { Authorization: PEXELS_API_KEY }
  });
  const data = await res.json();

  // Append instead of replacing
  imagesGrid.innerHTML += data.photos.map(p => `
    <div class="img-card">
      <img src="${p.src.medium}" alt="${escapeHtml(p.alt)}" />
      <div class="img-caption">${escapeHtml(p.photographer)}</div>
    </div>
  `).join("");
}

/* -------------------- Videos -------------------- */
async function fetchVideos(query, page = 1) {
  const res = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json`);
  const data = await res.json();

  metaVideos.textContent = `Search results for "${query}"`;
  videosGrid.innerHTML = `
    <h3>${data.Heading || "Results"}</h3>
    ${data.RelatedTopics.map(item => `
      <div class="video-card">
        ${item.Icon?.URL ? `<img src="https://duckduckgo.com${item.Icon.URL}" alt="">` : ""}
        <div class="video-title">${item.Text || "No title"}</div>
        <a href="${item.FirstURL}" target="_blank">View</a>
      </div>
    `).join("")}
  `;
}


/* -------------------- GNews Config -------------------- */
const HOME_NEWS_API_KEY = "0570b26fc4268cb2e3c54a01ec226625";
let homeNewsPage = 1;
let searchNewsPage = 1;

/* -------------------- Homepage News (PLENTY) -------------------- */
async function loadHomeNews(reset = true) {
  if (reset) homeNewsList.innerHTML = `<div class="small">Loading news…</div>`;

  try {
    // ❌ removed country filter (free-plan safe)
    const res = await fetch(
      `https://gnews.io/api/v4/top-headlines?lang=en&max=10&page=${homeNewsPage}&token=${HOME_NEWS_API_KEY}`
    );

    const data = await res.json();
    console.log("Home news:", data); // debug

    if (!data.articles || !data.articles.length) {
      if (reset) homeNewsList.innerHTML = `<div class="small">No news available.</div>`;
      return;
    }

    if (reset) homeNewsList.innerHTML = "";

    data.articles.forEach(a => {
      homeNewsList.insertAdjacentHTML("beforeend", `
        <div class="news-card">
          <img src="${a.image || 'https://via.placeholder.com/160x96'}">
          <div class="meta">

            <div class="source">
              ${escapeHtml(a.source.name)} • ${new Date(a.publishedAt).toLocaleDateString()}
            </div>
          </div>
        </div>
      `);

    homeNewsPage++;

  } catch (e) {
    console.error("Home news error:", e);
    homeNewsList.innerHTML = `<div class="small">Unable to load news.</div>`;
  }
}

/* -------------------- Search News (PLENTY) -------------------- */

/* -------------------- Books -------------------- */
async function fetchBooks(query, page = 1) {
  const pageSize = 10;
  try {
    const startIndex = (page - 1) * pageSize;
    const url = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&startIndex=${startIndex}&maxResults=${pageSize}`;
    const res = await fetch(url);
    const data = await res.json();
    const items = data.items || [];

    booksList.innerHTML = items.map(it => {
      const info = it.volumeInfo;
      const title = escapeHtml(info.title || 'No title');
      const authors = escapeHtml((info.authors || []).join(', ') || 'Unknown');
      const img = info.imageLinks?.thumbnail || 'placeholder.jpg'; // fallback if no image
      const link = escapeHtml(info.infoLink);

      return `
        <div class="result">
          <img src="${img}" alt="${title}" class="book-cover">
          <div class="r-title">${title}</div>
          <div class="r-snippet">By: ${authors}</div>
          <a href="${link}" class="btn">More info</a>
        </div>
      `;
    }).join('');

    metaBooks.textContent = `Page ${page} — Showing ${items.length} books for "${query}"`;
  } catch (err) {
    console.warn(err);
    metaBooks.textContent = 'Error loading books.';
  }
}

/* -------------------- Pagination -------------------- */
prevBtn.addEventListener('click', ()=>changePage(-1));
nextBtn.addEventListener('click', ()=>changePage(0));
function changePage(dir){
  const activeTab = tabs.find(t=>t.classList.contains('active'))?.dataset.tab || 'all';
  if(activeTab==='all'){ return; } // no pagination for AI/Web
  let page = currentPage[activeTab] + dir;
  if(page<1) page=1;
  currentPage[activeTab] = page;
  runPage(activeTab);
}

function runPage(tab){
  const page = currentPage[tab];
  switch(tab){
    case 'images': fetchPexelsImages(currentQuery,page); break;
    case 'videos': fetchVideos(currentQuery,page); break;
    case 'news': fetchNews(currentQuery,page); break;
    case 'books': fetchBooks(currentQuery,page); break;
  }
  updatePageIndicator();
}

function updatePageIndicator(){
  const activeTab = tabs.find(t=>t.classList.contains('active'))?.dataset.tab || 'all';
  if(activeTab==='all'){
    pageIndicator.textContent='Page N/A';
    prevBtn.disabled=true;
    nextBtn.disabled=true;
  } else {
    const page = currentPage[activeTab] || 1;
    pageIndicator.textContent=`Page ${page}`;
    prevBtn.disabled = page <= 1;
    nextBtn.disabled = false;
  }
}

/* -------------------- Voice Search -------------------- */
let recognition;
micBtn.addEventListener('click', ()=>{
  if(!('webkitSpeechRecognition' in window)) return alert('Voice search not supported.');
  if(!recognition){
    recognition = new webkitSpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';
    recognition.onresult = e=> { qInput.value = e.results[0][0].transcript; runAll(qInput.value); };
    recognition.onerror = e=>console.warn(e);
  }
  recognition.start();
});

/* -------------------- AI Speech -------------------- */


// ensure voices are loaded before using them
let voices = [];

function loadVoices() {
  voices = speechSynthesis.getVoices();
  if (!voices.length) {
    // if not yet loaded, retry when the voiceschanged event fires
    speechSynthesis.onvoiceschanged = () => {
      voices = speechSynthesis.getVoices();
    };
  }
}
loadVoices();

aiSpeechBtn.addEventListener('click', () => {
  const text = aiAnswerEl.innerText.trim();
  if (!text) return;

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';

  // Try to find a female-sounding voice
  const femaleVoice = voices.find(v =>
    /female|woman|zira|samantha|victoria|karen|google us english|google uk english female/i.test(v.name)
  );

  utter.voice = femaleVoice || voices.find(v => v.lang.startsWith('en')) || null;

  // Optional tone adjustment
  utter.pitch = 1.1; // slightly higher pitch for feminine tone
  utter.rate = 1;

  speechSynthesis.cancel(); // stop ongoing speech
  speechSynthesis.speak(utter);
});
