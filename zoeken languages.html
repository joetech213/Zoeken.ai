<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duolingo AI</title>
  <STYle>
    body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #00c48c, #00796b);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.app {
  width: 360px;
  background: #1c1f1e;
  border-radius: 25px;
  padding: 20px;
  box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
}

header {
  text-align: center;
  margin-bottom: 20px;
}

#role span {
  color: #00e676;
  font-weight: bold;
}

#lesson-box {
  background: #2e3231;
  padding: 15px;
  border-radius: 15px;
  min-height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

#user-input {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  margin-top: 10px;
}

button {
  background: #00e676;
  border: none;
  color: #000;
  padding: 10px 20px;
  border-radius: 10px;
  margin-top: 10px;
  cursor: pointer;
  width: 100%;
}

button:hover {
  background: #00c853;
}

  </STYle>
</head>
<body>
  <div class="app">
    <header>
      <h1>🦉 Duolingo AI Tutor</h1>
      <div id="role">Role: <span>Language Teacher</span></div>
    </header>

    <main>
      <div id="lesson-box">
        <p id="lesson-text">Click "Start Lesson" to begin!</p>
      </div>

      <input type="text" id="user-input" placeholder="Type your answer..." />
      <button id="send-btn">Send</button>
    </main>

    <footer>
      <button id="start-btn">Start Lesson</button>
    </footer>
  </div>

  <script>
const OPENAI_KEY = "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";

const startBtn = document.getElementById("start-btn");
const sendBtn = document.getElementById("send-btn");
const lessonText = document.getElementById("lesson-text");
const userInput = document.getElementById("user-input");

let lessonContext = [
  { role: "system", content: "You are Duolingo AI — a friendly and patient language tutor that teaches English to beginners. You give short, fun lessons, simple grammar examples, and quiz questions. You respond in 1–2 short sentences per turn." }
];

startBtn.addEventListener("click", async () => {
  lessonText.textContent = "Starting lesson...";
  const reply = await askOpenAI("Give me the first beginner English lesson with examples.");
  lessonText.textContent = reply;
});

sendBtn.addEventListener("click", async () => {
  const userMessage = userInput.value.trim();
  if (!userMessage) return;

  lessonText.textContent = "Thinking...";
  const reply = await askOpenAI(userMessage);
  lessonText.textContent = reply;
  userInput.value = "";
});

async function askOpenAI(message) {
  lessonContext.push({ role: "user", content: message });

  const response = await fetch("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    headers: {
      "Authorization": `Bearer ${OPENAI_KEY}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      model: "gpt-4o-mini",
      messages: lessonContext,
      max_tokens: 120
    })
  });

  const data = await response.json();
  const aiMessage = data.choices[0].message.content;
  lessonContext.push({ role: "assistant", content: aiMessage });
  return aiMessage;
}

  </script>
</body>
</html>
