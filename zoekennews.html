<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZoKen News 2025</title>
<link rel="icon" href="logo.png">
<style>
  :root{    
    --bg:#ffffff;
    --muted:#5f6368;
    --accent:#1a73e8;
    --card:#ffffff;
    --glass:rgba(60,64,67,0.04);
    --radius:12px;
    --shadow:0 6px 18px rgba(60,64,67,0.07);
    font-family:'Roboto',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial;
    color:#202124;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg)}
  .topbar{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid rgba(0,0,0,0.06);display:flex;justify-content:center;padding:12px 0}
  .topbar-inner{width:100%;max-width:1100px;display:flex;align-items:center;gap:18px;padding:0 18px}
  .logo{width:56px;height:56px}
  .logo img{width:100%;height:100%;object-fit:contain}
  .search-box{display:flex;gap:10px;flex:1}
  .search-box input{flex:1;padding:10px;border-radius:999px;border:1px solid #ddd}
  .btn{background:var(--accent);color:white;border:0;padding:10px 16px;border-radius:999px;cursor:pointer;font-weight:600}
  .container{display:flex;justify-content:center;padding:20px}
  .card{width:100%;max-width:1100px;padding:18px;border-radius:12px;box-shadow:var(--shadow)}
  .tabs{display:flex;gap:16px;border-bottom:1px solid #eee;padding-bottom:12px;overflow-x:auto}
  .tab{cursor:pointer;color:var(--muted)}
  .tab.active{color:var(--accent);font-weight:600;border-bottom:3px solid var(--accent)}
  .content{margin-top:18px}
  .news-card{display:flex;gap:16px;padding:14px;border-radius:12px;border:1px solid #eee;margin-bottom:12px}
  .news-card img{width:160px;height:96px;object-fit:cover;border-radius:10px}
  .headline{font-size:18px;font-weight:600}
  .headline a{text-decoration:none;color:#202124}
  .headline a:hover{text-decoration:underline}
  .source{font-size:14px;color:var(--muted);margin-top:6px}
</style>
</head>

<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="logo"><img src="logo.png"></div>
    <div class="search-box">
      <input id="newsQuery" placeholder="Search for news...">
      <button class="btn" id="searchBtn">Search</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="card">
    <div class="tabs">
      <div class="tab active" data-category="general">Top News</div>
      <div class="tab" data-category="sports">Sports</div>
      <div class="tab" data-category="technology">Technology</div>
      <div class="tab" data-category="entertainment">Entertainment</div>
      <div class="tab" data-category="health">Health</div>
      <div class="tab" data-category="science">Science</div>
    </div>

    <div class="content" id="newsContent">Loading news…</div>
  </div>
</div>
<script>
const tabs = document.querySelectorAll(".tab");
const newsContent = document.getElementById("newsContent");
const searchBtn = document.getElementById("searchBtn");
const newsQuery = document.getElementById("newsQuery");

let category = "top";
let nextPage = null;

const NEWSDATA_API_KEY = "pub_af01aa8c2e5048b6abd8de833b36d8cc";

tabs.forEach(tab => {
  tab.onclick = () => {
    tabs.forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    category = tab.dataset.category;
    nextPage = null;
    loadNews(true);
  };
});

searchBtn.onclick = () => {
  nextPage = null;
  loadNews(true);
};

async function loadNews(reset = false) {
  if (reset) newsContent.innerHTML = "Loading news…";

  let url = `https://newsdata.io/api/1/news?apikey=${NEWSDATA_API_KEY}&language=en&size=10`;

  const query = newsQuery.value.trim();

  if (query) {
    url += `&q=${encodeURIComponent(query)}`;
  } else {
    // category fallback for free plan
    if (category !== "general") {
      url += `&q=${category}`;
    }
  }

  if (nextPage) url += `&page=${nextPage}`;

  try {
    const res = await fetch(url);
    const data = await res.json();

    console.log("News API response:", data); // 🔍 DEBUG

    if (!data.results || data.results.length === 0) {
      if (reset) newsContent.innerHTML = "No news found (API returned empty results).";
      return;
    }

    if (reset) newsContent.innerHTML = "";

    data.results.forEach(a => {
      newsContent.insertAdjacentHTML("beforeend", `
        <div class="news-card">
          <img src="${a.image_url || 'https://via.placeholder.com/160x96'}">
          <div>
            <div class="headline">
              <a href="${a.link}" target="_blank">${a.title}</a>
            </div>
            <div class="source">
              ${a.source_id || "Unknown"} • ${a.pubDate || ""}
            </div>
          </div>
        </div>
      `);
    });

    nextPage = data.nextPage || null;

    if (nextPage && !document.getElementById("loadMore")) {
      const btn = document.createElement("button");
      btn.id = "loadMore";
      btn.className = "btn";
      btn.style.margin = "16px auto";
      btn.style.display = "block";
      btn.textContent = "Load more news";
      btn.onclick = () => loadNews(false);
      newsContent.appendChild(btn);
    }

  } catch (err) {
    console.error("Fetch error:", err);
    newsContent.innerHTML = "Error loading news.";
  }
}

loadNews(true);
</script>

</body>
</html>
